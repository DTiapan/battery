[project]
name = "battery"
version = "0.1.0"
description = "Sovereign, local-first context engine for AI workflows"
readme = "README.md"
authors = [
    { name = "DTiapan", email = "bakran.ajas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "mcp>=2.2.0",
    "pysqlite3-binary>=0.5.4.post2 ; sys_platform == 'linux'",
    "rich>=15.0.0",
    "sqlean-py>=3.50.4.5 ; sys_platform != 'linux'",
    "sqlite-vec>=0.1.9",
    "typer>=0.27.2",
]

[project.scripts]
battery = "battery:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "ruff>=0.9.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

